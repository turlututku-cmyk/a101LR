<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="gem" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="tint">
        <feFuncR type="table" tableValues="0.15 0.5 0.9"/>
        <feFuncG type="table" tableValues="0.17 0.55 0.92"/>
        <feFuncB type="table" tableValues="0.2 0.6 0.95"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.2" specularExponent="24" lighting-color="#ffffff" result="spec">
        <fePointLight x="14" y="6" z="45"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="glowA"/>
      <feFlood flood-color="#b9c2d0" flood-opacity="0.85"/>
      <feComposite in2="glowA" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="tint"/><feMergeNode in="specIn"/></feMerge>
    </filter>
  </defs>
  <text x="32" y="50" text-anchor="middle" font-size="46" filter="url(#gem)" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🐸</text>
  <path d="M54 4 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 z" fill="#fff"/>
</svg>